
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My To-Do List</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="style.css">s
</head>
<body>

    <nav class="navbar navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="#">My To-Do List</a>
        </div>
    </nav>

    <div class="container mt-5">
        <h1 class="text-center">My Tasks</h1>

        <div class="input-group mt-4">
            <input type="text" id="taskInput" class="form-control" placeholder="Enter a task">
            <button id="addTaskBtn" class="btn btn-primary">Add Task</button>
        </div>

        <p id="errorMessage" class="text-danger mt-2"></p>

        <div class="mt-4">
            <button class="btn btn-secondary filter-btn" data-filter="all">All</button>
            <button class="btn btn-warning filter-btn" data-filter="active">Active</button>
            <button class="btn btn-success filter-btn" data-filter="completed">Completed</button>
        </div>

        <ul id="taskList" class="list-group mt-3"></ul>

        <div class="d-flex justify-content-between align-items-center mt-3">
            <p id="taskCounter">0 tasks left</p>
            <button id="clearCompletedBtn" class="btn btn-danger btn-sm">
                Clear Completed
            </button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
